server {
    listen 9443 ssl;
    server_name 47.108.114.17;
    ssl_certificate /etc/nginx/ssl/xiaozhi-ota.crt;
    ssl_certificate_key /etc/nginx/ssl/xiaozhi-ota.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    location /xiaozhi-ota/api/ {
        proxy_pass http://127.0.0.1:3070;
        proxy_read_timeout 15s;
    }
    location /xiaozhi-ota/files/ {
        alias /opt/xiaozhi-ota/data/files/;
        autoindex off;
        disable_symlinks on;
        limit_except GET { deny all; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }
    location /files/ {
        alias /opt/xiaozhi-ota/public/;
        autoindex off;
        disable_symlinks on;
        limit_except GET { deny all; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment always;
    }
    location / { return 404; }
}
